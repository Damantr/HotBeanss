<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/form.css">
    <title>Document</title>
</head>
<body>
    <div class="left-side-flex">
        <p>Fill out our form, in order
            to join our community</p>
        <p>Our hiring managers will process your application and
            after a one week you will get a result. </p>
    </div>
    <div class="right-side-flex">
        <p>Apply for a position</p>
        <div class="form-container">
            <form action="">
                <label for="name">Name:</label>
                <input type="text" name="" id="">

                <label for="surename">Surename:</label>
                <input type="text" name="" id="">

                <label for="email">Email:</label>
                <input type="text" name="" id="">

                <label for="phone-number">Phone number:</label>
                <input type="text" name="" id="">

                <label for="name">Select position:</label>
                <input type="text" name="" id="">

                <label for="name">Additional information about hard/soft skills:</label>
                <textarea type="text" name="" id="" rows="4"></textarea>

                <button class="submit-button" type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
